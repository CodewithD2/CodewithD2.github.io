<style>
/* Layout: one phone-width column. Home → language hub → tools (letters, phrases, about me, reader, review, quiz). */
:root {
  --bg: #EFF2F7;
  --surface: #FFFFFF;
  --ink: #111A2B;
  --muted: #5A6679;
  --line: #D6DDE8;
  --accent: #5B3FD6;
  --good: #2B8A3E;
  --bad: #C92A2A;
  --c: var(--accent);
  --ar: 'Cairo', 'Segoe UI', Tahoma, sans-serif;
  --tx: 'Inter', 'Segoe UI', Roboto, Arial, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0D121B; --surface: #172030; --ink: #EEF2F8; --muted: #9AA6B8; --line: #2A3547; --accent: #9C88FF; --good: #51CF66; --bad: #FF6B6B; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0D121B; --surface: #172030; --ink: #EEF2F8; --muted: #9AA6B8; --line: #2A3547; --accent: #9C88FF; --good: #51CF66; --bad: #FF6B6B; color-scheme: dark }

* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--ink); }
body { margin: 0; font-family: var(--ar); font-size: 17px; line-height: 1.6; -webkit-tap-highlight-color: transparent; }
#app { max-width: 680px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 56px; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.tx { font-family: var(--tx); direction: ltr; unicode-bidi: isolate; }
h2 { font-size: 19px; margin: 22px 4px 10px; }
.muted { color: var(--muted); }
.stack { display: flex; flex-direction: column; gap: 12px; }

body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); display: flex; align-items: center; gap: 12px; padding-block: 12px; }
.bar h1 { margin: 0; font-size: 21px; font-weight: 800; flex: 1; min-width: 0; text-wrap: balance; }
.back { border: 0; background: var(--surface); border-radius: 12px; padding: 6px 14px; font-weight: 700; box-shadow: 0 1px 0 var(--line); }

.hero { padding-block: 22px 6px; }
.hero h1 { margin: 0; font-size: 34px; font-weight: 800; line-height: 1.2; }
.hero p { margin: 4px 0 0; color: var(--muted); }

.panel { background: var(--surface); border-radius: 20px; padding: 16px; }
.today { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }
.stat { background: var(--surface); border-radius: 18px; padding: 14px; }
.stat b { display: block; font-size: 30px; line-height: 1.1; font-family: var(--tx); }
.stat span { color: var(--muted); font-size: 15px; }
.btn { border: 0; border-radius: 14px; padding: 12px 16px; font-weight: 800; background: var(--surface); box-shadow: 0 1px 0 var(--line); min-height: 48px; }
.btn.main { background: var(--c); color: #fff; box-shadow: none; }
.btn.wide { width: 100%; }
.btn.small { min-height: 38px; padding: 6px 12px; font-size: 15px; }
.btn.ghost { background: transparent; box-shadow: inset 0 0 0 2px var(--line); }
.row { display: flex; flex-wrap: wrap; gap: 8px; }

.langs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.lang { border: 0; border-radius: 22px; padding: 18px 16px; background: var(--surface); text-align: right; display: flex; flex-direction: column; gap: 2px; box-shadow: inset 0 -6px 0 var(--c); }
.lang .f { font-size: 40px; line-height: 1.2; }
.lang .n { font-size: 21px; font-weight: 800; }
.lang .nt { font-family: var(--tx); color: var(--muted); font-size: 15px; }
.lang .p { font-size: 14px; color: var(--muted); margin-top: 6px; }

.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.tile { border: 0; border-radius: 18px; padding: 14px; background: var(--surface); text-align: right; display: flex; flex-direction: column; min-height: 104px; }
.tile .e { font-size: 30px; line-height: 1.2; }
.tile .t { font-weight: 800; font-size: 18px; }
.tile .d { color: var(--muted); font-size: 14px; line-height: 1.4; }
.tile.hot { background: var(--c); color: #fff; }
.tile.hot .d { color: #fff; opacity: .85; }
.plan { counter-reset: s; list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px; }
.plan li { display: flex; gap: 10px; align-items: baseline; }
.plan li::before { counter-increment: s; content: counter(s); font-family: var(--tx); font-weight: 700; color: var(--c); min-width: 1ch; }
.warn { background: color-mix(in srgb, #F59F00 16%, var(--surface)); border-radius: 14px; padding: 10px 14px; font-size: 15px; }

/* letters */
.filters { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 12px; }
.chip { border: 0; white-space: nowrap; border-radius: 99px; padding: 6px 14px; background: var(--surface); font-weight: 700; font-size: 15px; }
.chip[aria-pressed="true"] { background: var(--c); color: #fff; }
.letters { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.letter { background: var(--surface); border-radius: 18px; padding: 14px; display: flex; flex-direction: column; gap: 4px; border-top: 5px solid var(--kc); min-width: 0; }
.letter .big { font-family: var(--tx); font-size: 38px; font-weight: 700; line-height: 1.1; direction: ltr; text-align: left; }
.letter .snd { font-size: 15px; }
.letter .snd b { font-size: 18px; }
.letter .exw { border: 0; background: color-mix(in srgb, var(--kc) 12%, var(--surface)); border-radius: 12px; padding: 6px 10px; text-align: left; direction: ltr; }
.letter .exw b { font-family: var(--tx); font-size: 18px; }
.letter .exw small { display: block; color: var(--muted); font-family: var(--tx); }
.letter .note { font-size: 14px; color: var(--muted); }
.k-same { --kc: #2B8A3E; } .k-false { --kc: #E8590C; } .k-new { --kc: #5B3FD6; } .k-diff { --kc: #E8590C; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 14px; color: var(--muted); margin: 0 4px 12px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; background: var(--kc); margin-inline-end: 4px; }

/* phrase rows */
.ph { background: var(--surface); border-radius: 16px; padding: 12px 14px; display: flex; gap: 10px; align-items: center; }
.ph .txt { flex: 1; min-width: 0; }
.ph .t { font-family: var(--tx); font-weight: 700; font-size: 20px; direction: ltr; text-align: left; overflow-wrap: anywhere; }
.ph .tr { font-family: var(--tx); color: var(--c); font-size: 15px; direction: ltr; text-align: left; }
.ph .m { font-family: var(--tx); color: var(--muted); font-size: 16px; direction: ltr; text-align: left; transition: filter .15s; }
.hide .ph .m:not(.open) { filter: blur(7px); cursor: pointer; }
.icon { border: 0; width: 44px; height: 44px; flex: none; border-radius: 12px; background: color-mix(in srgb, var(--c) 12%, var(--surface)); font-size: 19px; }
.icon.on { background: var(--good); color: #fff; }

/* reader */
.txt-item { flex-direction: row; gap: 12px; align-items: center; min-height: 0; }
.txt-item .te { font-size: 34px; width: 56px; height: 56px; flex: none; display: grid; place-items: center; border-radius: 16px; background: color-mix(in srgb, var(--c) 12%, var(--surface)); }
.txt-item .tb { display: flex; flex-direction: column; flex: 1; min-width: 0; }
.kind { display: inline-block; font-size: 13px; font-weight: 800; border-radius: 99px; padding: 1px 10px; background: color-mix(in srgb, var(--c) 14%, var(--surface)); color: var(--c); }
.reader { background: var(--surface); border-radius: 20px; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.sent { display: flex; flex-direction: column; gap: 4px; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
.sent:last-child { border-bottom: 0; padding-bottom: 0; }
.sent .src { font-family: var(--tx); font-size: 22px; line-height: 1.6; direction: ltr; text-align: left; }
.w { cursor: pointer; border-radius: 6px; padding: 0 1px; background: transparent; border: 0; font: inherit; color: inherit; }
.w:hover, .w.sel { background: color-mix(in srgb, var(--c) 18%, transparent); }
.w.saved { text-decoration: underline 2px color-mix(in srgb, var(--good) 70%, transparent); text-underline-offset: 4px; }
.sent .en { font-family: var(--tx); color: var(--muted); font-size: 16px; direction: ltr; text-align: left; }
.sent .tools { display: flex; gap: 6px; }
.notrans .sent .en:not(.open) { display: none; }

/* vocab after reading */
.vrow { display: flex; align-items: center; gap: 10px; background: var(--surface); border-radius: 14px; padding: 8px 12px; }
.vrow input { width: 22px; height: 22px; flex: none; accent-color: var(--c); }
.vrow .vw { font-family: var(--tx); font-weight: 700; font-size: 18px; min-width: 0; }
.vrow .vm { font-family: var(--tx); color: var(--muted); font-size: 15px; flex: 1; min-width: 0; direction: ltr; text-align: left; }
.vrow .in { font-size: 13px; color: var(--good); font-weight: 800; white-space: nowrap; }
.sticky-foot { position: sticky; bottom: 0; background: var(--bg); padding-block: 12px calc(env(safe-area-inset-bottom, 0px) + 8px); display: flex; flex-direction: column; gap: 8px; }

/* review card */
.flash { background: var(--surface); border-radius: 24px; padding: 28px 18px; text-align: center; display: flex; flex-direction: column; gap: 10px; align-items: center; min-height: 300px; justify-content: center; border-top: 6px solid var(--c); }
.flash .front { font-family: var(--tx); font-size: clamp(28px, 8vw, 44px); font-weight: 700; direction: ltr; overflow-wrap: anywhere; }
.flash .back { font-family: var(--tx); font-size: 22px; direction: ltr; }
.flash .ctx { font-family: var(--tx); color: var(--muted); font-size: 15px; direction: ltr; }
.grade { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
.grade .no { background: var(--bad); color: #fff; }
.grade .yes { background: var(--good); color: #fff; }
.grade small { display: block; font-weight: 600; opacity: .85; font-size: 13px; }
.manual { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 8px; }
.progress { height: 8px; background: var(--surface); border-radius: 99px; overflow: hidden; margin-bottom: 12px; }
.progress i { display: block; height: 100%; background: var(--c); }

/* quiz */
.opts { display: grid; gap: 10px; margin-top: 12px; }
.opt { border: 2px solid var(--line); background: var(--surface); border-radius: 16px; padding: 14px; font-family: var(--tx); font-size: 18px; direction: ltr; text-align: left; }
.opt.right { border-color: var(--good); background: color-mix(in srgb, var(--good) 14%, var(--surface)); }
.opt.wrong { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 12%, var(--surface)); }

/* words table */
.tbl { width: 100%; border-collapse: collapse; background: var(--surface); border-radius: 16px; overflow: hidden; }
.tbl .acts { display: flex; flex-direction: column; gap: 6px; }
.tbl .acts .icon { width: 38px; height: 38px; font-size: 16px; }
.tbl td, .tbl th { padding: 8px 6px; border-bottom: 1px solid var(--line); text-align: right; vertical-align: middle; }
.tbl th { font-size: 14px; color: var(--muted); font-weight: 600; }
.tbl .tx { font-size: 16px; }
.tbl tr:last-child td { border-bottom: 0; }
.due-now { color: var(--bad); font-weight: 800; }
.tblwrap { overflow-x: auto; border-radius: 16px; }

/* forms */
.form { display: flex; flex-direction: column; gap: 12px; }
.form label { display: flex; flex-direction: column; gap: 4px; font-weight: 700; }
.form input[type=text], .form input[type=number], .form select, textarea { border: 2px solid var(--line); border-radius: 12px; padding: 10px 12px; background: var(--bg); font-weight: 400; }
.checks { display: flex; flex-wrap: wrap; gap: 8px; }
.checks label { flex-direction: row; align-items: center; gap: 6px; background: var(--bg); border-radius: 99px; padding: 4px 12px; font-weight: 600; font-size: 15px; }
.seg { display: flex; gap: 8px; }
.seg label { flex: 1; flex-direction: row; justify-content: center; gap: 6px; background: var(--bg); border-radius: 12px; padding: 8px; }
.intro { display: flex; flex-direction: column; gap: 10px; }
.intro .ln { display: flex; gap: 10px; align-items: flex-start; }
.intro .ln div { flex: 1; min-width: 0; }
.intro .ln .t { font-family: var(--tx); font-size: 19px; font-weight: 700; direction: ltr; text-align: left; }
.intro .ln .m { font-family: var(--tx); font-size: 15px; color: var(--muted); direction: ltr; text-align: left; }

.tip { background: var(--surface); border-radius: 18px; padding: 16px; }
.tip h3 { margin: 0 0 4px; font-size: 18px; }
.tip p { margin: 0; }
.tip .how { margin-top: 6px; color: var(--c); font-weight: 700; font-size: 15px; }

/* bottom sheet */
.scrim { position: fixed; inset: 0; background: rgb(0 0 0 / .35); z-index: 40; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 41; background: var(--surface); border-radius: 22px 22px 0 0; padding: 18px max(18px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 18px) max(18px, env(safe-area-inset-left, 0px)); max-width: 680px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 -8px 30px rgb(0 0 0 / .15); }
.sheet .word { font-family: var(--tx); font-size: 32px; font-weight: 700; direction: ltr; text-align: left; }
.sheet .mean { font-family: var(--tx); font-size: 20px; direction: ltr; text-align: left; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 24px); background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 14px; font-weight: 700; z-index: 60; max-width: calc(100% - 32px); text-align: center; }
.empty { text-align: center; color: var(--muted); padding: 30px 10px; }
.upd { margin-top: 22px; }
.upd .btn { background: var(--good); color: #fff; box-shadow: none; }
.umeta { margin: 6px 0 0; color: var(--muted); font-size: 14px; }
@media (prefers-reduced-motion: no-preference) { .tile:active, .lang:active, .btn:active, .opt:active { transform: scale(.98); } }
</style>

let profile = store.get('profile', { gender: 'm', country: 'eg', job: 'engineer', hobbies: ['read', 'travel'] });
let read = store.get('read', {});          // {"es-0": timestamp}
let days = store.get('days', []);          // ["2026-11-24", ...]
let prefs = store.get('prefs', { hidePh: false, trans: true });
const saveDeck = () => store.set('deck', deck);
const idOf = (lang, t) => lang + '|' + t.toLowerCase();
const inDeck = (lang, t) => deck.some(d => d.id === idOf(lang, t));
function markDay() {
  const k = new Date().toLocaleDateString('en-CA');
  if (!days.includes(k)) { days.push(k); store.set('days', days); }
}
function streak() {
  let n = 0; const d = new Date();
  if (!days.includes(d.toLocaleDateString('en-CA'))) d.setDate(d.getDate() - 1);
  while (days.includes(d.toLocaleDateString('en-CA'))) { n++; d.setDate(d.getDate() - 1); }
  return n;
}
function addItem(o, inD = 1, quiet) {
  const id = idOf(o.lang, o.t);
  const ex = deck.find(d => d.id === id);
  const due = Date.now() + inD * DAY;
  if (ex) { ex.due = Math.min(ex.due, due); saveDeck(); if (!quiet) toast('موجودة في جدولك، وقرّبت ميعاد مراجعتها'); return false; }
  deck.push({ id, lang: o.lang, t: o.t, m: o.m, tr: o.tr || '', ex: o.ex || '', added: Date.now(), due, lvl: 0 });
  saveDeck(); markDay();
  if (!quiet) toast(`✅ اتضافت — هتراجعها ${ivLabel(inD)}`);
  return true;
}
const dueList = lang => deck.filter(d => d.due <= Date.now() && (!lang || d.lang === lang)).sort((a, b) => a.due - b.due);

// ---------- speech ----------
// Never read a language with another language's voice: if the device has no voice for it, explain how to install one.
let voices = [];
function loadVoices() { try { voices = speechSynthesis.getVoices() || []; } catch {} }
if ('speechSynthesis' in window) { loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
const norm = l => String(l || '').toLowerCase().replace('_', '-');
const hasVoice = lang => voices.some(v => norm(v.lang).startsWith(lang));
function pickVoice(lang) {
  const want = norm(LANGS[lang].tts);
  const ok = voices.filter(v => norm(v.lang).startsWith(lang));
  const score = v => (norm(v.lang) === want ? 4 : 0) + (/natural|neural|premium|enhanced|google/i.test(v.name) ? 2 : 0) + (v.localService ? 1 : 0);
  return ok.sort((x, y) => score(y) - score(x))[0] || null;
}
function voicesReady() {
  if (voices.length) return Promise.resolve();
  return new Promise(res => {
    const t = setTimeout(res, 1500);
    speechSynthesis.addEventListener?.('voiceschanged', () => { loadVoices(); clearTimeout(t); res(); }, { once: true });
    loadVoices(); if (voices.length) { clearTimeout(t); res(); }
  });
}
async function say(lang, text, slow) {
  if (!('speechSynthesis' in window)) return voiceHelp(lang);
  await voicesReady();
  const v = pickVoice(lang);
  if (!v) return voiceHelp(lang);
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(String(text).replace(/\s\/\s/g, '. '));
  u.voice = v; u.lang = v.lang; u.rate = slow ? 0.6 : 0.9;
  speechSynthesis.speak(u);
}
function voiceHelp(lang) {

  closeSheet();

      <li><b>آيفون:</b> Settings ← Accessibility ← Spoken Content ← Voices ← ${L.native}</li>

      <li><b>ماك:</b> System Settings ← Accessibility ← Spoken Content ← System voice ← Manage Voices</li>

  document.body.appendChild(d);

const COUNTRY_EN = { eg: ['Egypt', 'Egyptian'], sa: ['Saudi Arabia', 'Saudi'], ae: ['the UAE', 'Emirati'], jo: ['Jordan', 'Jordanian'], us: ['the USA', 'American'] };
const COUNTRY_AR = { eg: 'مصر', sa: 'السعودية', ae: 'الإمارات', jo: 'الأردن', us: 'أمريكا' };
const JOB_EN = { engineer: ['an engineer', 'مهندس'], doctor: ['a doctor', 'دكتور'], teacher: ['a teacher', 'مدرّس'], student: ['a student', 'طالب'], programmer: ['a programmer', 'مبرمج'], accountant: ['an accountant', 'محاسب'], designer: ['a designer', 'مصمم'], manager: ['a manager', 'مدير'], business: ['a businessperson', 'رجل/سيدة أعمال'] };
const HOB_EN = { read: ['reading', 'القراية'], travel: ['traveling', 'السفر'], cook: ['cooking', 'الطبخ'], football: ['playing football', 'الكورة'], music: ['listening to music', 'المزيكا'], movies: ['watching movies', 'الأفلام'], code: ['programming', 'البرمجة'], swim: ['swimming', 'العوم'] };
function joinList(arr, and) { return arr.length < 2 ? (arr[0] || '') : arr.slice(0, -1).join(', ') + ` ${and} ` + arr[arr.length - 1]; }
function ruYears(n) { const a = n % 10, b = n % 100; return a === 1 && b !== 11 ? 'год' : a >= 2 && a <= 4 && (b < 12 || b > 14) ? 'года' : 'лет'; }
function introLines(code) {
  const L = LANGS[code], M = L.me, p = profile, g = p.gender === 'f' ? 1 : 0;
  const fill = (s, o) => s.replace(/\{(\w+)\}/g, (_, k) => o[k] ?? '');
  const hob = (p.hobbies || []).slice(0, 3);
  const o = {
    name: p.name || '…', age: p.age || '…', years: ruYears(+p.age || 0), city: p.city || '…',
    country: M.countries[p.country][0], demonym: (M.countries[p.country][g + 1] || ''), country_en: COUNTRY_EN[p.country][0], demonym_en: COUNTRY_EN[p.country][1],
    job: M.jobs[p.job][g], job_en: JOB_EN[p.job][0],
    hobbies: joinList(hob.map(h => M.hobbies[h]), M.and), hobbies_en: joinList(hob.map(h => HOB_EN[h][0]), 'and')
  };
  const keys = ['hello', 'age', 'from', 'live', 'job'];
  if (hob.length) keys.push('likes');
  keys.push('langs', 'bye');
  return keys.map(k => [fill(M[k], o), fill(M[k + 'En'], o)]);
}

}

function startReview(lang) { rv = { lang, queue: dueList(lang), i: 0, shown: false, ok: 0 }; }
function viewReview(lang) {

function grade(g) {
  const it = rv.queue[rv.i], d = deck.find(x => x.id === it.id);
  if (d) {
    if (g === 'no') { d.lvl = 0; d.due = Date.now() + 10 * 60 * 1000; rv.queue.push(d); }
    else if (g === 'yes') { const n = IV[Math.min(d.lvl, IV.length - 1)]; d.lvl = Math.min(d.lvl + 1, IV.length - 1); d.due = Date.now() + n * DAY; }

}

// ---------- quiz ----------
let qz = null;
function quizPool(code) {
  const L = LANGS[code], pool = new Map();
  deck.filter(d => d.lang === code).forEach(d => pool.set(d.t.toLowerCase(), { t: d.t, m: d.m, tr: d.tr }));
  if (pool.size < 12) {
    L.phrases.forEach(c => c.items.forEach(([t, m, tr]) => pool.has(t.toLowerCase()) || pool.set(t.toLowerCase(), { t, m, tr })));
    L.texts.forEach(T => Object.entries(T.v).forEach(([t, m]) => pool.has(t) || pool.set(t, { t, m })));
  }
  return [...pool.values()];
}
function startQuiz(code, letters) {
  const L = LANGS[code];
  let pool = letters ? L.abc.map(x => ({ t: x.l, m: `${x.ar} — ${x.s}`, letter: 1 })) : quizPool(code);
  const items = shuffle(pool).slice(0, 10);
  qz = { code, letters, pool, items, i: 0, score: 0, picked: null, wrong: [],
    qs: items.map((it, k) => {
      const listen = !letters && k % 3 === 2;
      const others = shuffle(pool.filter(p => p.t !== it.t && p.m !== it.m)).slice(0, 3);
      return { it, listen, opts: shuffle([it, ...others]) };
    }) };
}
function viewQuiz(code, letters) {
  const L = LANGS[code], back = letters ? 'abc-' + code : 'lang-' + code;
  if (!qz || qz.code !== code || !!qz.letters !== !!letters) startQuiz(code, letters);
  const head = `<div style="--c:${L.color}">` + bar(letters ? '🎯 اختبار الحروف' : '🎯 اختبرني', back);
  if (qz.i >= qz.qs.length) {
    const s = qz.score, n = qz.qs.length, w = qz.wrong.length; qz = null; markDay();
    return head + `<div class="flash"><div style="font-size:60px">${s >= n * .8 ? '🏆' : s >= n / 2 ? '👍' : '💪'}</div>
      <b style="font-size:24px">${ar(s)} من ${ar(n)}</b>
      <p class="muted">${w && !letters ? `الكلمات اللي غلطت فيها (${ar(w)}) اتضافت لجدول الحفظ عشان تراجعها.` : s === n ? 'ممتاز! كلها صح.' : 'كمّل، وكل مرة هتبقى أحسن.'}</p>
      <div class="row" style="justify-content:center"><button class="btn main" data-quiz-again="${letters ? 1 : 0}">جولة تانية</button><button class="btn" data-go="${back}">رجوع</button></div></div></div>`;
  }
  const q = qz.qs[qz.i], done = qz.picked !== null;
  const label = o => q.listen ? o.t : o.m;
  return head + `<div class="progress"><i style="width:${Math.round(100 * qz.i / qz.qs.length)}%"></i></div>
  <p class="muted" style="margin:0 4px 8px">سؤال ${ar(qz.i + 1)} من ${ar(qz.qs.length)} · ${q.listen ? 'اسمع واختار الكلمة' : letters ? 'الحرف ده بيتنطق إزاي؟' : 'معناها إيه؟'}</p>
  <div class="flash" style="min-height:180px">
    ${q.listen ? `<button class="btn main" data-say="${esc(q.it.t)}" data-l="${code}" style="font-size:22px">🔊 اسمع تاني</button>` : `<div class="front">${esc(q.it.t)}</div>`}
    ${!q.listen && !letters ? sayBtn(code, q.it.t) : ''}
  </div>
  <div class="opts">${q.opts.map((o, k) => {
    const cls = done ? (o.t === q.it.t ? 'right' : k === qz.picked ? 'wrong' : '') : '';
    return `<button class="opt ${cls}" data-pick="${k}" ${done ? 'disabled' : ''}>${esc(label(o))}</button>`; }).join('')}</div>
  ${done ? `<button class="btn main wide" style="margin-top:12px" data-qnext="1">${qz.i + 1 < qz.qs.length ? 'السؤال اللي بعده ←' : 'النتيجة'}</button>` : ''}</div>`;
}
function pick(k) {
  const q = qz.qs[qz.i]; if (qz.picked !== null) return;
  qz.picked = k;
  const ok = q.opts[k].t === q.it.t;
  if (ok) qz.score++; else { qz.wrong.push(q.it); if (!qz.letters) addItem({ lang: qz.code, t: q.it.t, m: q.it.m, tr: q.it.tr }, 0, true); }
  if (q.listen || !qz.letters) say(qz.code, q.it.t);
  route();
}

// ---------- download & update (installed app only) ----------

    <p class="umeta">${Object.values(LANGS).map(L => `${L.flag} ${hasVoice(L.code) ? 'الصوت موجود ✅' : 'نزّل الصوت من الإعدادات ⚠️'}`).join(' · ')}</p></div>`;
}
function paintUpd() { const u = $('#upd'); if (u) u.outerHTML = updHTML(); }
async function checkUpdate() {
  if (!PWA) return;
  if (!navigator.onLine) { updState = 'offline'; return paintUpd(); }
  try { const j = await (await fetch('version.json?t=' + Date.now(), { cache: 'no-store' })).json(); updState = j.v > VERSION ? 'available' : 'latest'; }
  catch { updState = 'offline'; }
  paintUpd();
}
async function downloadAll() {
  if (!navigator.onLine) { updState = 'offline'; return paintUpd(); }
  updState = 'working'; paintUpd();
  try {
    const c = await caches.open('lisan-v1');
    for (const u of ['./', './index.html', './manifest.json', './icon-192.png', './icon-512.png']) { const r = await fetch(u, { cache: 'reload' }); if (r.ok) await c.put(u, r); }
    const fl = document.querySelector('link[href*="fonts.googleapis"]');
    if (fl) {
      const css = await fetch(fl.href).then(r => { c.put(fl.href, r.clone()); return r.text(); });
      for (const m of css.matchAll(/url\((https:[^)]+)\)/g)) { try { const r = await fetch(m[1]); if (r.ok) await c.put(m[1], r); } catch {} }
    }
    try { const reg = await navigator.serviceWorker.getRegistration(); if (reg) await reg.update(); } catch {}
    store.set('justUpdated', true); location.reload();
  } catch { updState = 'offline'; paintUpd(); toast('حصلت مشكلة، جرّب تاني وإنت على واي فاي'); }

function closeSheet() { const s = $('#sheetWrap'); if (s) s.remove(); }

// ---------- router ----------
function route() {
  closeSheet();
  const h = location.hash.slice(1) || 'home';
  const [v, a, b] = h.split('-');
  const L = a && LANGS[a];
  let html;
  if (v === 'lang' && L) html = viewLang(a);
  else if (v === 'abc' && L) html = viewAbc(a);
  else if (v === 'abcq' && L) html = viewQuiz(a, true);
  else if (v === 'phr' && L) html = viewPhr(a);
  else if (v === 'me' && L) html = viewMe(a);
  else if (v === 'texts' && L) html = viewTexts(a);
  else if (v === 'read' && L && L.texts[+b]) html = viewRead(a, +b);
  else if (v === 'vocab' && L && L.texts[+b]) html = viewVocab(a, +b);
  else if (v === 'review') html = viewReview(L ? a : null);
  else if (v === 'quiz' && L) html = viewQuiz(a, false);
  else if (v === 'words') html = viewWords();
  else if (v === 'tips') html = viewTips();
  else if (v === 'backup') html = viewBackup();
  else html = viewHome();
  $('#app').innerHTML = html;
}
let lastHash = '';
function onHash() { const h = location.hash; if (h.split('-')[0] !== lastHash.split('-')[0] || h !== lastHash) window.scrollTo(0, 0); if (!h.startsWith('#review')) rv = null; if (!h.startsWith('#quiz') && !h.startsWith('#abcq')) qz = null; lastHash = h; route(); }
function go(h) { if (location.hash.slice(1) === h) route(); else location.hash = h; }
window.addEventListener('hashchange', onHash);

// ---------- events ----------
document.addEventListener('click', e => {
  const b = e.target.closest('button, [data-reveal]'); if (!b) return;
  const d = b.dataset;
  if (d.reveal) { b.classList.add('open'); return; }
  if (d.close) return closeSheet();
  if (d.go) return go(d.go);
  if (d.w) { const r = b.closest('.reader').dataset.text.split('-'); document.querySelectorAll('.w.sel').forEach(x => x.classList.remove('sel')); b.classList.add('sel'); return openSheet(r[0], +r[1], d.w); }
  if (d.say !== undefined && d.l) return say(d.l, d.say);
  if (d.sayallText !== undefined) return say(d.l, LANGS[d.l].texts[+d.sayallText].s.map(x => x[0]).join(' '));
  if (d.slowallText !== undefined) return say(d.l, LANGS[d.l].texts[+d.slowallText].s.map(x => x[0]).join(' '), true);
  if (d.sayall) return say(d.sayall, introLines(d.sayall).map(x => x[0]).join(' '));
  if (d.add !== undefined) { const ok = addItem({ lang: d.l, t: d.add, m: d.m, tr: d.tr, ex: d.ex }, 1); if (ok !== undefined) { b.classList.add('on'); b.textContent = '✓'; } return; }
  if (d.sadd) { const w = $('#sheetWrap').dataset; addItem({ lang: w.l, t: w.t, m: w.m, ex: w.ex }, +d.sadd); const btn = document.querySelector('.w.sel'); closeSheet(); document.querySelectorAll('.w').forEach(x => { if (x.dataset.w.toLowerCase() === w.t) x.classList.add('saved'); }); return; }
  if (d.addintro) { let n = 0; introLines(d.addintro).forEach(([t, m]) => { if (!t.includes('…') && addItem({ lang: d.addintro, t, m }, 1, true)) n++; }); toast(n ? `✅ اتضاف ${ar(n)} جملة — هتراجعهم بكرة` : 'الجمل دي موجودة في جدولك'); return; }
  if (d.abcf) { abcFilter = d.abcf; return route(); }
  if (d.hideph) { prefs.hidePh = !prefs.hidePh; store.set('prefs', prefs); return route(); }
  if (d.trans) { prefs.trans = !prefs.trans; store.set('prefs', prefs); return route(); }
  if (d.showen) { $('#en-' + d.showen).classList.add('open'); b.remove(); return; }
  if (d.vsel) { document.querySelectorAll('#vlist input:not(:disabled)').forEach(c => c.checked = d.vsel === 'all'); return; }
  if (d.vadd) {
    const sel = [...document.querySelectorAll('#vlist input:checked:not(:disabled)')];
    if (!sel.length) return toast('اختار كلمة واحدة على الأقل');
    sel.forEach(c => addItem({ lang: d.l, t: c.dataset.vt, m: c.dataset.vm, ex: c.dataset.vex }, +d.vadd, true));
    toast(`✅ اتضاف ${ar(sel.length)} كلمة — هتراجعهم ${ivLabel(+d.vadd)}`); return route();
  }
  if (d.revealCard) { rv.shown = true; return route(); }
  if (d.grade) return grade(d.grade);
  if (d.pick) return pick(+d.pick);
  if (d.qnext) { qz.i++; qz.picked = null; route(); window.scrollTo(0, 0); if (qz && qz.qs[qz.i] && qz.qs[qz.i].listen) say(qz.code, qz.qs[qz.i].it.t); return; }
  if (d.quizAgain !== undefined) { qz = null; return route(); }
  if (d.wf) { wf = d.wf; return route(); }
  if (d.tf) { tf = d.tf; return route(); }
  if (d.del) { deck = deck.filter(x => x.id !== d.del); saveDeck(); toast('اتمسحت'); return route(); }
  if (d.update) return downloadAll();
  if (d.voicehelp) return voiceHelp(d.voicehelp);
  if (d.copybk) { const t = $('#bk-out'); navigator.clipboard?.writeText(t.value).then(() => toast('✅ اتنسخت'), () => { t.select(); toast('النص متحدد — انسخه'); }) ?? (t.select(), toast('النص متحدد — انسخه')); return; }
  if (d.importbk) {
    try {
      const j = JSON.parse($('#bk-in').value); let n = 0;
      (j.deck || []).forEach(x => { if (x.id && !deck.some(y => y.id === x.id)) { deck.push(x); n++; } });
      saveDeck();
      if (j.profile && !profile.name) { profile = j.profile; store.set('profile', profile); }
      if (j.read) { read = { ...j.read, ...read }; store.set('read', read); }
      if (j.days) { days = [...new Set([...days, ...j.days])]; store.set('days', days); }
      toast(`✅ اترجعت — ${ar(n)} كلمة جديدة`); go('home');
    } catch { toast('النص ده مش نسخة صحيحة'); }
  }
});
function syncProfile() {
  const f = $('#meForm'); if (!f) return;
  const fd = new FormData(f);
  profile = { name: fd.get('name').trim(), gender: fd.get('gender'), age: fd.get('age'), country: fd.get('country'), city: fd.get('city').trim(), job: fd.get('job'), hobbies: fd.getAll('hobbies').slice(0, 3) };
  store.set('profile', profile);
  const code = location.hash.split('-')[1];
  $('#introOut').innerHTML = introHTML(code, introLines(code));
}
document.addEventListener('input', e => { if (e.target.closest('#meForm')) syncProfile(); });
document.addEventListener('change', e => {
  if (e.target.name === 'hobbies' && document.querySelectorAll('#meForm input[name=hobbies]:checked').length > 3) { e.target.checked = false; toast('اختار ٣ بس'); }
  if (e.target.closest('#meForm')) syncProfile();
});
document.addEventListener('submit', e => e.preventDefault());
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });

lastHash = location.hash;
route();
if (PWA) {
  if (store.get('justUpdated', false)) { store.set('justUpdated', false); toast('✅ اتحدّث وكل حاجة متحمّلة للاستخدام من غير نت'); }
  checkUpdate();
  window.addEventListener('online', checkUpdate);
  window.addEventListener('offline', () => { updState = 'offline'; paintUpd(); });
}
if ('speechSynthesis' in window) speechSynthesis.addEventListener?.('voiceschanged', () => { const h = location.hash; if (!h || h === '#home' || h.startsWith('#lang')) route(); });
</script>

<script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});</script>
