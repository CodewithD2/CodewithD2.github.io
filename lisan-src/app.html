<title>لسان</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Inter:wght@400;600;700&display=swap">
<style>
/* Layout: one phone-width column. Home → language hub → tools (letters, phrases, topics, quotes & art, about me, reader, review, quiz). */
:root {
  --bg: #EFF2F7;
  --surface: #FFFFFF;
  --ink: #111A2B;
  --muted: #5A6679;
  --line: #D6DDE8;
  --accent: #5B3FD6;
  --good: #2B8A3E;
  --bad: #C92A2A;
  --c: var(--accent);
  --ar: 'Cairo', 'Segoe UI', Tahoma, sans-serif;
  --tx: 'Inter', 'Segoe UI', Roboto, Arial, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0D121B; --surface: #172030; --ink: #EEF2F8; --muted: #9AA6B8; --line: #2A3547; --accent: #9C88FF; --good: #51CF66; --bad: #FF6B6B; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0D121B; --surface: #172030; --ink: #EEF2F8; --muted: #9AA6B8; --line: #2A3547; --accent: #9C88FF; --good: #51CF66; --bad: #FF6B6B; color-scheme: dark }
:root[data-theme="light"] { color-scheme: light; }

* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--ink); }
body { margin: 0; font-family: var(--ar); font-size: 17px; line-height: 1.6; -webkit-tap-highlight-color: transparent; }
#app { max-width: 680px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 56px; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.tx { font-family: var(--tx); direction: ltr; unicode-bidi: isolate; }
h2 { font-size: 19px; margin: 22px 4px 10px; }
.muted { color: var(--muted); }
.stack { display: flex; flex-direction: column; gap: 12px; }

body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); display: flex; align-items: center; gap: 10px; padding-block: 12px; }
.bar h1 { margin: 0; font-size: 21px; font-weight: 800; flex: 1; min-width: 0; text-wrap: balance; display: flex; align-items: center; gap: 8px; }
.back { border: 0; background: var(--surface); border-radius: 12px; padding: 6px 14px; font-weight: 700; box-shadow: 0 1px 0 var(--line); white-space: nowrap; }
.theme-btn { border: 0; width: 42px; height: 42px; border-radius: 12px; background: var(--surface); box-shadow: 0 1px 0 var(--line); font-size: 19px; display: grid; place-items: center; flex: none; }

.hero { padding-block: 22px 6px; display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.hero h1 { margin: 0; font-size: 34px; font-weight: 800; line-height: 1.2; }
.hero p { margin: 4px 0 0; color: var(--muted); }

.flg { display: inline-block; vertical-align: -0.15em; border-radius: 5px; box-shadow: 0 0 0 1px rgb(0 0 0 / .08); flex: none; }
.lang .flg { width: 44px; height: 30px; border-radius: 7px; margin-bottom: 4px; }

.panel { background: var(--surface); border-radius: 20px; padding: 16px; }
.today { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }
.stat { background: var(--surface); border-radius: 18px; padding: 14px; }
.stat b { display: block; font-size: 30px; line-height: 1.1; font-family: var(--tx); }
.stat span { color: var(--muted); font-size: 15px; }
.btn { border: 0; border-radius: 14px; padding: 12px 16px; font-weight: 800; background: var(--surface); box-shadow: 0 1px 0 var(--line); min-height: 48px; }
.btn.main { background: var(--c); color: #fff; box-shadow: none; }
.btn.stop { background: var(--bad); color: #fff; box-shadow: none; }
.btn.wide { width: 100%; }
.btn.small { min-height: 38px; padding: 6px 12px; font-size: 15px; }
.btn.ghost { background: transparent; box-shadow: inset 0 0 0 2px var(--line); }
.row { display: flex; flex-wrap: wrap; gap: 8px; }

.langs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.lang { border: 0; border-radius: 22px; padding: 18px 16px; background: var(--surface); text-align: right; display: flex; flex-direction: column; gap: 2px; box-shadow: inset 0 -6px 0 var(--c); }
.lang .n { font-size: 21px; font-weight: 800; }
.lang .nt { font-family: var(--tx); color: var(--muted); font-size: 15px; direction: ltr; text-align: right; }
.lang .p { font-size: 14px; color: var(--muted); margin-top: 6px; }

.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.tile { border: 0; border-radius: 18px; padding: 14px; background: var(--surface); text-align: right; display: flex; flex-direction: column; min-height: 104px; }
.tile .e { font-size: 30px; line-height: 1.2; }
.tile .t { font-weight: 800; font-size: 18px; }
.tile .d { color: var(--muted); font-size: 14px; line-height: 1.4; }
.tile.hot { background: var(--c); color: #fff; }
.tile.hot .d { color: #fff; opacity: .88; }

/* interactive daily plan */
.plan { display: flex; flex-direction: column; gap: 8px; }
.plan-step { border: 0; width: 100%; background: var(--bg); border-radius: 14px; padding: 10px 12px; display: flex; align-items: center; gap: 10px; text-align: right; transition: background .15s; }
.plan-step.done { background: color-mix(in srgb, var(--good) 14%, var(--bg)); }
.plan-step .chk { width: 26px; height: 26px; border-radius: 99px; display: grid; place-items: center; font-family: var(--tx); font-weight: 700; font-size: 14px; background: var(--surface); color: var(--c); box-shadow: inset 0 0 0 2px var(--line); flex: none; }
.plan-step.done .chk { background: var(--good); color: #fff; box-shadow: none; }
.plan-step .ptxt { flex: 1; font-size: 15px; }
.plan-step .parr { color: var(--muted); font-weight: 800; }

.warn { background: color-mix(in srgb, #F59F00 16%, var(--surface)); border-radius: 14px; padding: 10px 14px; font-size: 15px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; }

/* letters & filter chips */
.filters { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 12px; }
.chip { border: 0; white-space: nowrap; border-radius: 99px; padding: 6px 12px; background: var(--surface); font-weight: 700; font-size: 14px; box-shadow: 0 1px 0 var(--line); }
.chip[aria-pressed="true"] { background: var(--c); color: #fff; box-shadow: none; }
.letters { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 420px) { .letters { grid-template-columns: 1fr; } }
.letter { background: var(--surface); border-radius: 18px; padding: 14px; display: flex; flex-direction: column; gap: 4px; border-top: 5px solid var(--kc); min-width: 0; }
.letter .big { font-family: var(--tx); font-size: 34px; font-weight: 700; line-height: 1.15; direction: ltr; text-align: left; }
.letter .snd { font-size: 15px; }
.letter .snd b { font-size: 18px; }
.letter .exw { border: 0; background: color-mix(in srgb, var(--kc) 12%, var(--surface)); border-radius: 12px; padding: 8px 10px; text-align: left; direction: ltr; margin-top: 2px; }
.letter .exw b { font-family: var(--tx); font-size: 17px; }
.letter .exw small { display: block; color: var(--muted); font-family: var(--tx); margin-top: 2px; }
.letter .note { font-size: 14px; color: var(--muted); }
.k-same { --kc: #2B8A3E; } .k-false { --kc: #E8590C; } .k-new { --kc: #5B3FD6; } .k-diff { --kc: #E8590C; }

/* bilingual meaning formatting */
.m-bi { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 8px; }
.m-ar { font-family: var(--ar); direction: rtl; unicode-bidi: isolate; font-weight: 600; color: var(--ink); }
.m-en { font-family: var(--tx); direction: ltr; unicode-bidi: isolate; color: var(--muted); font-size: 0.92em; }

/* phrase & specialized topic cards (LTR internal alignment so foreign phrase sits flush-left & buttons sit flush-right) */
.ph { background: var(--surface); border-radius: 16px; padding: 12px 14px; display: flex; gap: 10px; align-items: center; direction: ltr; }
.ph .txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.ph .t { font-family: var(--tx); font-weight: 700; font-size: 20px; direction: ltr; text-align: left; overflow-wrap: anywhere; }
.ph .tr { font-family: var(--tx); color: var(--c); font-size: 14px; direction: ltr; text-align: left; }
.ph .m { color: var(--muted); font-size: 15px; text-align: left; transition: filter .15s; }
.ph .m .m-bi { direction: ltr; justify-content: flex-start; }
.ph .ex-line { margin-top: 4px; padding-top: 6px; border-top: 1px dashed var(--line); font-family: var(--tx); font-size: 14px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.ph .ex-line span { flex: 1; min-width: 0; }
.ph .acts { display: flex; gap: 6px; flex: none; align-items: center; }
.hide .ph .m:not(.open) { filter: blur(7px); cursor: pointer; user-select: none; }
.icon { border: 0; width: 42px; height: 42px; flex: none; border-radius: 12px; background: color-mix(in srgb, var(--c) 12%, var(--surface)); font-size: 18px; display: grid; place-items: center; padding: 0; }
.icon.sm { width: 32px; height: 32px; font-size: 14px; border-radius: 9px; }
.icon.on { background: var(--good); color: #fff; }

/* quotes & art */
.qcard { background: var(--surface); border-radius: 20px; padding: 18px; display: flex; flex-direction: column; gap: 10px; border-inline-start: 5px solid var(--c); }
.qcard .qsrc { font-family: var(--tx); font-size: 21px; font-weight: 700; line-height: 1.55; direction: ltr; text-align: left; }
.qcard .qtr { font-family: var(--tx); font-size: 14px; color: var(--c); direction: ltr; text-align: left; }
.qcard .qar { font-size: 17px; font-weight: 700; color: var(--ink); }
.qcard .qen { font-family: var(--tx); font-size: 14px; color: var(--muted); direction: ltr; text-align: left; }
.qcard .qmeta { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; padding-top: 8px; border-top: 1px solid var(--line); font-size: 14px; color: var(--muted); }

/* reader */
.txt-item { flex-direction: row; gap: 12px; align-items: center; min-height: 0; }
.txt-item .te { font-size: 32px; width: 54px; height: 54px; flex: none; display: grid; place-items: center; border-radius: 16px; background: color-mix(in srgb, var(--c) 12%, var(--surface)); }
.txt-item .tb { display: flex; flex-direction: column; flex: 1; min-width: 0; gap: 2px; }
.kind { display: inline-block; font-size: 13px; font-weight: 800; border-radius: 99px; padding: 1px 10px; background: color-mix(in srgb, var(--c) 14%, var(--surface)); color: var(--c); }
.reader { background: var(--surface); border-radius: 20px; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.sent { display: flex; flex-direction: column; gap: 5px; padding: 8px 10px 12px; margin-inline: -10px; border-radius: 12px; border-bottom: 1px solid var(--line); transition: background .2s; }
.sent:last-child { border-bottom: 0; padding-bottom: 6px; }
.sent.speaking { background: color-mix(in srgb, var(--c) 13%, var(--surface)); }
.sent .src { font-family: var(--tx); font-size: 21px; line-height: 1.6; direction: ltr; text-align: left; }
.w { cursor: pointer; border-radius: 6px; padding: 0 2px; background: transparent; border: 0; font: inherit; color: inherit; }
.w:hover, .w.sel { background: color-mix(in srgb, var(--c) 20%, transparent); }
.w.saved { text-decoration: underline 2px color-mix(in srgb, var(--good) 75%, transparent); text-underline-offset: 4px; }
.sent .en { color: var(--muted); font-size: 16px; }
.sent .tools { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 2px; }
.notrans .sent .en:not(.open) { display: none; }

/* vocab after reading */
.vrow { display: flex; align-items: center; gap: 10px; background: var(--surface); border-radius: 14px; padding: 8px 12px; }
.vrow input { width: 22px; height: 22px; flex: none; accent-color: var(--c); }
.vrow .vw { font-family: var(--tx); font-weight: 700; font-size: 18px; min-width: 0; }
.vrow .vm { color: var(--muted); font-size: 15px; flex: 1; min-width: 0; }
.vrow .in { font-size: 13px; color: var(--good); font-weight: 800; white-space: nowrap; }
.sticky-foot { position: sticky; bottom: 0; background: var(--bg); padding-block: 12px calc(env(safe-area-inset-bottom, 0px) + 8px); display: flex; flex-direction: column; gap: 8px; box-shadow: 0 -8px 16px var(--bg); }

/* review card */
.flash { background: var(--surface); border-radius: 24px; padding: 26px 18px; text-align: center; display: flex; flex-direction: column; gap: 10px; align-items: center; min-height: 290px; justify-content: center; border-top: 6px solid var(--c); }
.flash .front { font-family: var(--tx); font-size: clamp(26px, 7.5vw, 42px); font-weight: 700; direction: ltr; overflow-wrap: anywhere; }
.flash .front.ar-prompt { font-family: var(--ar); direction: rtl; font-size: clamp(22px, 6vw, 32px); }
.flash .back { font-size: 21px; }
.flash .back .m-bi { justify-content: center; flex-direction: column; align-items: center; }
.flash .ctx { font-family: var(--tx); color: var(--muted); font-size: 15px; direction: ltr; }
.flash .mnemo { background: color-mix(in srgb, #F59F00 15%, var(--surface)); padding: 6px 12px; border-radius: 10px; font-size: 15px; }
.grade { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
.grade .no { background: var(--bad); color: #fff; box-shadow: none; }
.grade .yes { background: var(--good); color: #fff; box-shadow: none; }
.grade small { display: block; font-weight: 600; opacity: .88; font-size: 13px; }
.manual { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 8px; }
.progress { height: 8px; background: var(--surface); border-radius: 99px; overflow: hidden; margin-bottom: 12px; }
.progress i { display: block; height: 100%; background: var(--c); transition: width .2s; }

/* quiz */
.opts { display: grid; gap: 10px; margin-top: 12px; }
.opt { border: 2px solid var(--line); background: var(--surface); border-radius: 16px; padding: 14px; font-size: 17px; text-align: right; }
.opt.ltr { font-family: var(--tx); direction: ltr; text-align: left; font-size: 18px; font-weight: 600; }
.opt.right { border-color: var(--good); background: color-mix(in srgb, var(--good) 14%, var(--surface)); }
.opt.wrong { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 12%, var(--surface)); }

/* words table & search */
.search { width: 100%; border: 2px solid var(--line); border-radius: 14px; padding: 10px 14px; background: var(--surface); margin-bottom: 10px; }
.tbl { width: 100%; border-collapse: collapse; background: var(--surface); border-radius: 16px; overflow: hidden; }
.tbl .acts { display: flex; gap: 5px; justify-content: flex-end; }
.tbl .acts .icon { width: 34px; height: 34px; font-size: 15px; }
@media (max-width: 500px) { .tbl .acts { flex-direction: column; align-items: center; } .tbl td, .tbl th { padding: 8px 6px; font-size: 14px; } }
.tbl td, .tbl th { padding: 10px 8px; border-bottom: 1px solid var(--line); text-align: right; vertical-align: middle; overflow-wrap: anywhere; }
.tbl th { font-size: 14px; color: var(--muted); font-weight: 700; }
.tbl .tx { font-size: 16px; }
.tbl tr:last-child td { border-bottom: 0; }
.due-now { color: var(--bad); font-weight: 800; }
.tblwrap { overflow-x: auto; border-radius: 16px; }
.note-tag { display: inline-block; margin-top: 3px; font-size: 13px; color: var(--c); font-weight: 600; }

/* forms */
.form { display: flex; flex-direction: column; gap: 12px; }
.form label { display: flex; flex-direction: column; gap: 4px; font-weight: 700; }
.form input[type=text], .form input[type=number], .form select, textarea { border: 2px solid var(--line); border-radius: 12px; padding: 10px 12px; background: var(--bg); font-weight: 400; width: 100%; }
.checks { display: flex; flex-wrap: wrap; gap: 8px; }
.checks label { flex-direction: row; align-items: center; gap: 6px; background: var(--bg); border-radius: 99px; padding: 4px 12px; font-weight: 600; font-size: 15px; }
.seg { display: flex; gap: 8px; }
.seg label { flex: 1; flex-direction: row; justify-content: center; gap: 6px; background: var(--bg); border-radius: 12px; padding: 8px; }
.intro { display: flex; flex-direction: column; gap: 10px; }
.intro .ln { display: flex; gap: 10px; align-items: center; direction: ltr; padding: 6px 8px; margin-inline: -8px; border-radius: 12px; transition: background .2s; }
.intro .ln.speaking { background: color-mix(in srgb, var(--c) 13%, var(--surface)); }
.intro .ln > div { flex: 1; min-width: 0; }
.intro .ln .t { font-family: var(--tx); font-size: 19px; font-weight: 700; direction: ltr; text-align: left; }
.intro .ln .m { font-family: var(--tx); font-size: 15px; color: var(--muted); direction: ltr; text-align: left; }

.tip { background: var(--surface); border-radius: 18px; padding: 16px; }
.tip h3 { margin: 0 0 4px; font-size: 18px; }
.tip p { margin: 0; }
.tip .how { margin-top: 6px; color: var(--c); font-weight: 700; font-size: 15px; }

/* bottom sheet */
.scrim { position: fixed; inset: 0; background: rgb(0 0 0 / .4); z-index: 40; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 41; background: var(--surface); border-radius: 22px 22px 0 0; padding: 18px max(18px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 18px) max(18px, env(safe-area-inset-left, 0px)); max-width: 680px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 -8px 30px rgb(0 0 0 / .2); max-height: 90vh; overflow-y: auto; }
.sheet .word { font-family: var(--tx); font-size: 30px; font-weight: 700; direction: ltr; text-align: left; }
.sheet .mean { font-size: 19px; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 24px); background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 14px; font-weight: 700; z-index: 60; max-width: calc(100% - 32px); text-align: center; box-shadow: 0 6px 20px rgb(0 0 0 / .22); }
.empty { text-align: center; color: var(--muted); padding: 30px 10px; }
.upd { margin-top: 22px; }
.upd .btn { background: var(--good); color: #fff; box-shadow: none; }
.umeta { margin: 6px 0 0; color: var(--muted); font-size: 14px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
@media (prefers-reduced-motion: no-preference) { .tile:active, .lang:active, .btn:active, .opt:active, .plan-step:active { transform: scale(.98); } }
</style>

<div id="app" dir="rtl" lang="ar"></div>
<div class="toast" id="toast" hidden></div>

<script>
const LANGS = __LANGS__;
const PWA = __PWA__;
const VERSION = __VERSION__;
const DAY = 864e5;
const IV = [1, 3, 7, 14, 30, 90, 180]; // review steps in days

// ---------- helpers ----------
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const store = {
  get(k, d) { try { const v = localStorage.getItem('lisan:' + k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem('lisan:' + k, JSON.stringify(v)); } catch {} }
};
document.documentElement.lang = 'ar'; document.documentElement.dir = 'rtl';
const shuffle = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
let toastTimer;
function toast(m) { const t = $('#toast'); t.textContent = m; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => t.hidden = true, 2400); }
const ar = n => String(n);
const biLang = L => L.name.startsWith('ال') ? 'بال' + L.name.slice(2) : 'بـ' + L.name;

// Crisp SVG flags so Windows & offline devices never render ugly "ES" / "RU" regional letters
function flagSVG(code, w = 24, h = 17) {
  if (code === 'es') return `<svg class="flg" width="${w}" height="${h}" viewBox="0 0 24 16" aria-hidden="true"><rect width="24" height="16" fill="#AA151B"/><rect y="4" width="24" height="8" fill="#F1BF00"/></svg>`;
  if (code === 'ru') return `<svg class="flg" width="${w}" height="${h}" viewBox="0 0 24 16" aria-hidden="true"><rect width="24" height="5.4" fill="#FFF"/><rect y="5.3" width="24" height="5.4" fill="#0039A6"/><rect y="10.6" width="24" height="5.4" fill="#D52B1E"/></svg>`;
  return `<span>${esc(LANGS[code]?.flag || '🌐')}</span>`;
}

// Render bilingual "عربي — English" cleanly when present, or LTR English fallback
function fmtMean(m) {
  const s = String(m ?? '');
  const idx = s.indexOf(' — ');
  if (idx > 0 && /[\u0600-\u06FF]/.test(s.slice(0, idx))) {
    const arPart = s.slice(0, idx), enPart = s.slice(idx + 3);
    return `<span class="m-bi"><span class="m-ar">${esc(arPart)}</span><span class="m-en">${esc(enPart)}</span></span>`;
  }
  if (/[\u0600-\u06FF]/.test(s)) return `<span class="m-ar">${esc(s)}</span>`;
  return `<span class="tx">${esc(s)}</span>`;
}

function inDays(ms) {
  const d = (ms - Date.now()) / DAY;
  if (d <= 0) return '<span class="due-now">دلوقتي</span>';
  if (d < 1 / 24) return 'بعد دقايق';
  if (d < 0.75) return 'النهارده';
  if (d < 1.5) return 'بكرة';
  if (d < 6.5) return `بعد ${ar(Math.round(d))} أيام`;
  if (d < 13) return 'بعد أسبوع';

let voices = [];
let seq = null; // { key, lang, list: [{text, sel}], idx, slow }
function loadVoices() { try { voices = speechSynthesis.getVoices() || []; } catch {} }
if ('speechSynthesis' in window) { loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
const norm = l => String(l || '').toLowerCase().replace('_', '-');
const hasVoice = lang => voices.some(v => norm(v.lang).startsWith(lang));
function pickVoice(lang) {
  const want = norm(LANGS[lang].tts);
  const ok = voices.filter(v => norm(v.lang).startsWith(lang));
  const score = v => (norm(v.lang) === want ? 4 : 0) + (/natural|neural|premium|enhanced|google/i.test(v.name) ? 2 : 0) + (v.localService ? 1 : 0);
  return ok.sort((x, y) => score(y) - score(x))[0] || null;
}
function voicesReady() {
  if (voices.length) return Promise.resolve();
  return new Promise(res => {
    const t = setTimeout(res, 1200);
    speechSynthesis.addEventListener?.('voiceschanged', () => { loadVoices(); clearTimeout(t); res(); }, { once: true });
    loadVoices(); if (voices.length) { clearTimeout(t); res(); }
  });
}
function stopSpeech() {
  seq = null;
  try { speechSynthesis.cancel(); } catch {}
  document.querySelectorAll('.speaking').forEach(el => el.classList.remove('speaking'));
  document.querySelectorAll('[data-orig-label]').forEach(b => {
    b.textContent = b.dataset.origLabel;
    b.classList.remove('stop');
    delete b.dataset.origLabel;
  });
}
async function say(lang, text, slow) {
  stopSpeech();
  if (!('speechSynthesis' in window)) return voiceHelp(lang);
  await voicesReady();
  const v = pickVoice(lang);
  if (!v) return voiceHelp(lang);
  const u = new SpeechSynthesisUtterance(String(text).replace(/\s\/\s/g, '. '));
  u.voice = v; u.lang = v.lang; u.rate = slow ? 0.58 : 0.9;
  speechSynthesis.speak(u);
}
async function playSeq(key, btn, lang, list, slow) {
  if (seq && seq.key === key) { stopSpeech(); return; }
  stopSpeech();
  if (!('speechSynthesis' in window)) return voiceHelp(lang);
  await voicesReady();
  const v = pickVoice(lang);
  if (!v) return voiceHelp(lang);
  if (!list.length) return;
  if (btn && !btn.dataset.origLabel) {
    btn.dataset.origLabel = btn.textContent;
    btn.textContent = '⏹️ وقّف الصوت';
    btn.classList.add('stop');
  }
  const cur = { key, lang, list, idx: 0, slow };
  seq = cur;
  const step = () => {
    if (seq !== cur) return;
    document.querySelectorAll('.speaking').forEach(el => el.classList.remove('speaking'));
    if (cur.idx >= cur.list.length) { stopSpeech(); return; }
    const item = cur.list[cur.idx];
    const row = item.sel ? document.querySelector(item.sel) : null;
    if (row) { row.classList.add('speaking'); row.scrollIntoView?.({ behavior: 'smooth', block: 'nearest' }); }
    const u = new SpeechSynthesisUtterance(String(item.text).replace(/\s\/\s/g, '. '));
    u.voice = v; u.lang = v.lang; u.rate = slow ? 0.58 : 0.9;
    u.onend = () => { if (seq === cur) { cur.idx++; step(); } };
    u.onerror = () => { if (seq === cur) stopSpeech(); };
    speechSynthesis.speak(u);
  };
  step();
}

let rv = null;

}
function dirChips() {

  return `<div class="filters">${modes.map(([k, l]) => `<button class="chip" data-revdir="${k}" aria-pressed="${prefs.revDir === k}">${l}</button>`).join('')}</div>`;
}
function viewReview(lang) {
  if (!rv || rv.lang !== lang) startReview(lang);

  const head = bar('🔁 المراجعة' + (L ? ' — ' + L.name : ''), back);
  if (!rv.queue.length) {
    if (lang) markStep(lang, 'rev');
    const next = deck.filter(d => !lang || d.lang === lang).sort((a, b) => a.due - b.due)[0];
    return head + dirChips() + `<div class="flash"><div style="font-size:60px">🎉</div><b style="font-size:22px">مفيش حاجة تراجعها دلوقتي</b>
      <p class="muted">${next ? `المراجعة الجاية: ${inDays(next.due)}` : 'ضيف كلمات من الجمل أو التخصصات أو النصوص الأول.'}</p></div>`;
  }
  if (rv.i >= rv.queue.length) {
    const n = rv.queue.length;
    if (lang) markStep(lang, 'rev');
    else Object.keys(LANGS).forEach(c => { if (rv.queue.some(x => x.lang === c)) markStep(c, 'rev'); });
    rv = null; markDay();
    return head + `<div class="flash"><div style="font-size:60px">✅</div><b style="font-size:22px">خلّصت المراجعة!</b><p class="muted">راجعت ${ar(n)} كلمة. ارجع بكرة تكمّل.</p>
      <button class="btn main" data-go="${back}">تمام</button></div>`;
  }
  const it = rv.queue[rv.i], live = deck.find(x => x.id === it.id) || it;
  const IL = LANGS[it.lang], nextD = IV[Math.min(live.lvl, IV.length - 1)];
  const isRev = !!it.rev;
  return `<div style="--c:${IL.color}">${head}${dirChips()}
  <div class="progress"><i style="width:${Math.round(100 * rv.i / rv.queue.length)}%"></i></div>
  <p class="muted" style="margin:0 4px 8px">${ar(rv.i + 1)} من ${ar(rv.queue.length)} · ${flagSVG(it.lang, 20, 14)} — ${isRev ? `تقدر تقول الكلمة دي ${biLang(IL)}؟ قولها بصوتك وبعدين اكشف.` : 'فاكر معناها؟ قولها بصوتك الأول، وبعدين اكشف المعنى.'}</p>
  <div class="flash">

    ${rv.shown ? `
      ${isRev ? `<div class="front" style="margin-top:6px;color:var(--c)">${esc(live.t)}</div>${live.tr ? `<div class="ctx">${esc(live.tr)}</div>` : ''}<div class="row" style="justify-content:center">${sayBtn(it.lang, live.t)}${slowBtn(it.lang, live.t)}</div>` : `<div class="back">${fmtMean(live.m)}</div>`}
      ${live.ex && live.ex.toLowerCase() !== live.t.toLowerCase() ? `<div class="ctx">«${esc(live.ex)}»</div>` : ''}
      ${live.note ? `<div class="mnemo">💡 ${esc(live.note)}</div>` : ''}
      <button class="btn small ghost" data-editnote="${esc(live.id)}">✏️ ${live.note ? 'عدّل الربط' : 'ضيف ربط يفكّرك'}</button>
    ` : `<button class="btn main" data-reveal-card="1">👁️ ${isRev ? 'اكشف الكلمة' : 'اكشف المعنى'}</button>`}
  </div>
  ${rv.shown ? `<div class="grade"><button class="btn no" data-grade="no">❌ مكنتش فاكر<small>هتظهر تاني بعد ١٠ دقايق</small></button>
    <button class="btn yes" data-grade="yes">✅ كنت فاكر<small>المراجعة الجاية ${ivLabel(nextD)}</small></button></div>

  if (d) {
    if (g === 'no') { d.lvl = 0; d.due = Date.now() + 10 * 60 * 1000; rv.queue.push({ ...d, rev: it.rev }); }
    else if (g === 'yes') { const n = IV[Math.min(d.lvl, IV.length - 1)]; d.lvl = Math.min(d.lvl + 1, IV.length - 1); d.due = Date.now() + n * DAY; }
    else { const n = +g; d.due = Date.now() + n * DAY; d.lvl = Math.max(0, IV.findIndex(x => x >= n)); }
    saveDeck();
  }
  rv.i++; rv.shown = false; route();
}

// ---------- quiz (General, Letters, or Specialized Topic + Voice-aware) ----------
let qz = null;
function quizPool(code, topicId) {
  const L = LANGS[code];
  if (topicId) {
    const tp = (L.topics || []).find(x => x.id === topicId);
    return tp ? tp.items.map(x => ({ t: x.t, m: x.m, tr: x.tr || '', ex: x.ex || '' })) : [];
  }
  const pool = new Map();
  deck.filter(d => d.lang === code).forEach(d => pool.set(d.t.toLowerCase(), { t: d.t, m: d.m, tr: d.tr }));
  if (pool.size < 12) {
    L.phrases.forEach(c => c.items.forEach(([t, m, tr]) => pool.has(t.toLowerCase()) || pool.set(t.toLowerCase(), { t, m, tr })));
    (L.topics || []).forEach(tp => tp.items.slice(0, 4).forEach(x => pool.has(x.t.toLowerCase()) || pool.set(x.t.toLowerCase(), { t: x.t, m: x.m, tr: x.tr || '' })));
    L.texts.forEach(T => Object.entries(T.v).forEach(([t, m]) => pool.has(t) || pool.set(t, { t, m })));
  }
  return [...pool.values()];
}
function startQuiz(code, mode = {}) {
  const L = LANGS[code], letters = !!mode.letters, topicId = mode.topicId || '';
  const canSpeak = hasVoice(code);
  let pool = letters ? L.abc.map(x => ({ t: x.l, m: `${x.ar} — ${x.s}`, letter: 1 })) : quizPool(code, topicId);
  const items = shuffle(pool).slice(0, Math.min(10, pool.length));
  const key = `${code}|${letters ? 'abc' : topicId || 'gen'}|${prefs.revDir}`;
  qz = { key, code, letters, topicId, pool, items, i: 0, score: 0, picked: null, wrong: [],
    qs: items.map((it, k) => {
      // Only ask listening-only questions if the device actually has a TTS voice installed for this language!
      const listen = !letters && canSpeak && k % 4 === 3;
      const rev = !letters && !listen && (prefs.revDir === 'reverse' || (prefs.revDir === 'mix' && k % 2 === 1));
      const others = shuffle(pool.filter(p => p.t !== it.t && p.m !== it.m)).slice(0, 3);
      return { it, listen, rev, opts: shuffle([it, ...others]) };
    }) };
}
function viewQuiz(code, mode = {}) {
  const L = LANGS[code], letters = !!mode.letters, topicId = mode.topicId || '';
  const tp = topicId ? (L.topics || []).find(x => x.id === topicId) : null;
  const back = letters ? 'abc-' + code : topicId ? `topic-${code}-${topicId}` : 'lang-' + code;
  const title = letters ? '🎯 اختبار الحروف' : tp ? `🎯 اختبار ${tp.title}` : '🎯 اختبرني';
  const wantKey = `${code}|${letters ? 'abc' : topicId || 'gen'}|${prefs.revDir}`;
  if (!qz || qz.key !== wantKey) startQuiz(code, mode);
  const head = `<div style="--c:${L.color}">` + bar(title, back) + (letters ? '' : dirChips());
  if (qz.i >= qz.qs.length) {
    const s = qz.score, n = qz.qs.length, w = qz.wrong.length;
    if (!letters) markStep(code, 'quiz');
    qz = null; markDay();
    return head + `<div class="flash"><div style="font-size:60px">${s >= n * .8 ? '🏆' : s >= n / 2 ? '👍' : '💪'}</div>
      <b style="font-size:24px">${ar(s)} من ${ar(n)}</b>
      <p class="muted">${w && !letters ? `الكلمات اللي غلطت فيها (${ar(w)}) اتضافت لجدول الحفظ عشان تراجعها.` : s === n ? 'ممتاز! كلها صح.' : 'كمّل، وكل مرة هتبقى أحسن.'}</p>
      <div class="row" style="justify-content:center"><button class="btn main" data-quiz-again="1">جولة تانية</button><button class="btn" data-go="${back}">رجوع</button></div></div></div>`;
  }
  const q = qz.qs[qz.i], done = qz.picked !== null;
  const promptLabel = q.listen ? 'اسمع واختار الكلمة' : letters ? 'الحرف ده بيتنطق إزاي؟' : q.rev ? `إيه معنى ده ${biLang(L)}؟` : 'معناها إيه؟';
  return head + `<div class="progress"><i style="width:${Math.round(100 * qz.i / qz.qs.length)}%"></i></div>
  <p class="muted" style="margin:0 4px 8px">سؤال ${ar(qz.i + 1)} من ${ar(qz.qs.length)} · ${promptLabel}</p>
  <div class="flash" style="min-height:175px">
    ${q.listen ? `<button class="btn main" data-say="${esc(q.it.t)}" data-l="${code}" style="font-size:20px">🔊 اسمع تاني</button>`
      : q.rev ? `<div class="front ar-prompt">${fmtMean(q.it.m)}</div>`
      : `<div class="front">${esc(q.it.t)}</div>`}
    ${!q.listen && !letters && !q.rev ? `<div class="row" style="justify-content:center">${sayBtn(code, q.it.t)}${slowBtn(code, q.it.t)}</div>` : ''}
  </div>
  <div class="opts">${q.opts.map((o, k) => {
    const cls = done ? (o.t === q.it.t ? 'right' : k === qz.picked ? 'wrong' : '') : '';
    const isForeignOpt = q.listen || q.rev;
    return `<button class="opt ${isForeignOpt ? 'ltr' : ''} ${cls}" data-pick="${k}" ${done ? 'disabled' : ''}>${isForeignOpt ? esc(o.t) : fmtMean(o.m)}</button>`; }).join('')}</div>
  ${done ? `<button class="btn main wide" style="margin-top:12px" data-qnext="1">${qz.i + 1 < qz.qs.length ? 'السؤال اللي بعده ←' : 'النتيجة'}</button>` : ''}</div>`;
}
function pick(k) {
  const q = qz.qs[qz.i]; if (qz.picked !== null) return;
  qz.picked = k;
  const ok = q.opts[k].t === q.it.t;
  if (ok) qz.score++; else { qz.wrong.push(q.it); if (!qz.letters) addItem({ lang: qz.code, t: q.it.t, m: q.it.m, tr: q.it.tr, ex: q.it.ex }, 0, true); }
  // Only auto-speak if device actually has a voice — never pop up voice installation modal after every quiz click!
  if ((q.listen || !qz.letters) && hasVoice(qz.code)) say(qz.code, q.it.t);
  route();
}

let updState = 'idle';
function updHTML() {

  const n = Object.values(LANGS).reduce((s, L) => s + L.texts.length, 0);

  return `<div class="panel upd" id="upd"><button class="btn wide" data-update="1" ${updState === 'working' ? 'disabled' : ''}>🔄 حمّل آخر تحديث</button>

    <p class="umeta">النسخة: ${new Intl.DateTimeFormat('ar-EG-u-nu-latn', { day: 'numeric', month: 'long', hour: 'numeric', minute: '2-digit' }).format(new Date(VERSION))} · ${ar(n)} نص ولوحة · ${ar(qn)} اقتباس</p>

}
function paintUpd() { const u = $('#upd'); if (u) u.outerHTML = updHTML(); }
async function checkUpdate() {
  if (!PWA) return;
  if (!navigator.onLine) { updState = 'offline'; return paintUpd(); }
  try { const j = await (await fetch('version.json?t=' + Date.now(), { cache: 'no-store' })).json(); updState = j.v > VERSION ? 'available' : 'latest'; }
  catch { updState = 'offline'; }
  paintUpd();
}
async function downloadAll() {
  if (!navigator.onLine) { updState = 'offline'; return paintUpd(); }
  updState = 'working'; paintUpd();
  try {
    const cacheName = 'lisan-' + VERSION;
    const c = await caches.open(cacheName);
    for (const u of ['./', './index.html', './manifest.json', './icon-192.png', './icon-512.png']) { const r = await fetch(u, { cache: 'reload' }); if (r.ok) await c.put(u, r); }
    const fl = document.querySelector('link[href*="fonts.googleapis"]');
    if (fl) {
      const css = await fetch(fl.href).then(r => { c.put(fl.href, r.clone()); return r.text(); });
      for (const m of css.matchAll(/url\((https:[^)]+)\)/g)) { try { const r = await fetch(m[1]); if (r.ok) await c.put(m[1], r); } catch {} }
    }
    try { const reg = await navigator.serviceWorker.getRegistration(); if (reg) await reg.update(); } catch {}
    store.set('justUpdated', true); location.reload();
  } catch { updState = 'offline'; paintUpd(); toast('حصلت مشكلة، جرّب تاني وإنت على واي فاي'); }
}

  const L = a && LANGS[a];
  let html;
  if (v === 'lang' && L) html = viewLang(a);
  else if (v === 'abc' && L) html = viewAbc(a);
  else if (v === 'abcq' && L) html = viewQuiz(a, { letters: true });
  else if (v === 'phr' && L) html = viewPhr(a);
  else if (v === 'topics' && L) html = viewTopics(a);
  else if (v === 'topic' && L && b) html = viewTopic(a, b);
  else if (v === 'topicq' && L && b) html = viewQuiz(a, { topicId: b });
  else if (v === 'quotes' && L) html = viewQuotes(a);
  else if (v === 'me' && L) { markStep(a, 'me'); html = viewMe(a); }
  else if (v === 'texts' && L) html = viewTexts(a);
  else if (v === 'read' && L && L.texts[+b]) html = viewRead(a, +b);
  else if (v === 'vocab' && L && L.texts[+b]) html = viewVocab(a, +b);
  else if (v === 'review') html = viewReview(L ? a : null);
  else if (v === 'quiz' && L) html = viewQuiz(a, {});
  else if (v === 'words') html = viewWords();
  else if (v === 'tips') html = viewTips();
  else if (v === 'backup') html = viewBackup();
  else html = viewHome();
  $('#app').innerHTML = html;
}
let lastHash = '';
function onHash() {
  stopSpeech();
  const h = location.hash;
  if (h !== lastHash) { topicQuery = ''; window.scrollTo(0, 0); }
  if (!h.startsWith('#review')) rv = null;
  if (!h.startsWith('#quiz') && !h.startsWith('#abcq') && !h.startsWith('#topicq')) qz = null;
  lastHash = h; route();
}
function go(h) { if (location.hash.slice(1) === h) route(); else location.hash = h; }
window.addEventListener('hashchange', onHash);

// ---------- events ----------
document.addEventListener('click', e => {
  const b = e.target.closest('button, [data-reveal]'); if (!b) return;
  const d = b.dataset;
  if (d.reveal) { b.classList.add('open'); return; }
  if (d.close) return closeSheet();
  if (d.themeToggle) {
    prefs.theme = isDark() ? 'light' : 'dark';
    store.set('prefs', prefs); applyTheme(); return route();
  }
  if (d.go) return go(d.go);
  if (d.w) {
    const [code, idx] = b.closest('.reader').dataset.text.split('-');
    const T = LANGS[code].texts[+idx], k = d.w.toLowerCase();
    const ex = (T.s.find(([s]) => (s.match(/\p{L}+/gu) || []).some(x => x.toLowerCase() === k)) || [''])[0];
    document.querySelectorAll('.w.sel').forEach(x => x.classList.remove('sel')); b.classList.add('sel');
    return openWordSheet(code, d.w, T.v, ex);
  }
  if (d.qw) {
    const [code, qi] = b.closest('[data-qbox]').dataset.qbox.split('-');
    const Q = LANGS[code].quotes[+qi];
    document.querySelectorAll('.w.sel').forEach(x => x.classList.remove('sel')); b.classList.add('sel');
    return openWordSheet(code, d.qw, Q.v, Q.q);
  }
  if (d.say !== undefined && d.l) return say(d.l, d.say, false);
  if (d.slow !== undefined && d.l) return say(d.l, d.slow, true);
  if (d.sayallText !== undefined) {
    const T = LANGS[d.l].texts[+d.sayallText];
    return playSeq(`txt-${d.l}-${d.sayallText}`, b, d.l, T.s.map((x, k) => ({ text: x[0], sel: `#sent-${k}` })), false);
  }
  if (d.slowallText !== undefined) {
    const T = LANGS[d.l].texts[+d.slowallText];
    return playSeq(`txtslow-${d.l}-${d.slowallText}`, b, d.l, T.s.map((x, k) => ({ text: x[0], sel: `#sent-${k}` })), true);
  }
  if (d.sayall) {
    markStep(d.sayall, 'me');
    const lines = introLines(d.sayall);
    return playSeq(`me-${d.sayall}`, b, d.sayall, lines.map((x, k) => ({ text: x[0], sel: `#intro-ln-${k}` })), false);
  }
  if (d.add !== undefined) { const ok = addItem({ lang: d.l, t: d.add, m: d.m, tr: d.tr, ex: d.ex }, 1); if (ok !== undefined) { b.classList.add('on'); b.textContent = '✓'; } return; }
  if (d.sadd) {
    const w = $('#sheetWrap').dataset, note = ($('#sh-note')?.value || '').trim();
    addItem({ lang: w.l, t: w.t, m: w.m, ex: w.ex, note }, +d.sadd);
    closeSheet();
    document.querySelectorAll('.w').forEach(x => { const rw = x.dataset.w || x.dataset.qw || ''; if (rw.toLowerCase() === w.t) x.classList.add('saved'); });
    return;
  }
  if (d.editnote) return openNoteSheet(d.editnote);
  if (d.savenote) {
    const item = deck.find(x => x.id === d.savenote);
    if (item) { item.note = ($('#sh-note')?.value || '').trim(); saveDeck(); toast('✅ اتحفظ الربط'); }
    closeSheet(); return route();
  }
  if (d.addintro) {
    markStep(d.addintro, 'me');
    let n = 0; introLines(d.addintro).forEach(([t, m]) => { if (!t.includes('…') && addItem({ lang: d.addintro, t, m }, 1, true)) n++; });
    toast(n ? `✅ اتضاف ${ar(n)} جملة — هتراجعهم بكرة` : 'الجمل دي موجودة في جدولك'); return;
  }
  if (d.addtopic) {
    const tp = (LANGS[d.l].topics || []).find(x => x.id === d.addtopic);
    if (!tp) return;
    let n = 0; tp.items.forEach(it => { if (addItem({ lang: d.l, t: it.t, m: it.m, tr: it.tr || '', ex: it.ex || '' }, 1, true)) n++; });
    toast(n ? `✅ اتضاف ${ar(n)} مصطلح لجدولك` : 'كل كلمات القسم ده في جدولك بالفعل'); return route();
  }
  if (d.abcf) { abcFilter = d.abcf; return route(); }
  if (d.qatab) { qaTab = d.qatab; markStep(qaLang, 'read'); return route(); }
  if (d.hideph) { prefs.hidePh = !prefs.hidePh; store.set('prefs', prefs); return route(); }
  if (d.hidetopic) { prefs.hideTopic = !prefs.hideTopic; store.set('prefs', prefs); return route(); }
  if (d.revdir) { prefs.revDir = d.revdir; store.set('prefs', prefs); rv = null; qz = null; return route(); }
  if (d.trans) { prefs.trans = !prefs.trans; store.set('prefs', prefs); return route(); }
  if (d.showen) { $('#en-' + d.showen).classList.add('open'); b.remove(); return; }
  if (d.vsel) { document.querySelectorAll('#vlist input:not(:disabled)').forEach(c => c.checked = d.vsel === 'all'); return; }
  if (d.vadd) {
    const sel = [...document.querySelectorAll('#vlist input:checked:not(:disabled)')];
    if (!sel.length) return toast('اختار كلمة واحدة على الأقل');
    sel.forEach(c => addItem({ lang: d.l, t: c.dataset.vt, m: c.dataset.vm, ex: c.dataset.vex }, +d.vadd, true));
    toast(`✅ اتضاف ${ar(sel.length)} كلمة — هتراجعهم ${ivLabel(+d.vadd)}`); return route();
  }
  if (d.revealCard) { rv.shown = true; return route(); }
  if (d.grade) return grade(d.grade);
  if (d.pick) return pick(+d.pick);
  if (d.qnext) { qz.i++; qz.picked = null; route(); window.scrollTo(0, 0); if (qz && qz.qs[qz.i] && qz.qs[qz.i].listen && hasVoice(qz.code)) say(qz.code, qz.qs[qz.i].it.t); return; }
  if (d.quizAgain !== undefined) { qz = null; return route(); }
  if (d.wf) { wf = d.wf; return route(); }
  if (d.wstat) { wStat = d.wstat; return route(); }
  if (d.toggleAddword) { showAddForm = !showAddForm; return route(); }
  if (d.tf) { tf = d.tf; return route(); }
  if (d.del) { deck = deck.filter(x => x.id !== d.del); saveDeck(); toast('اتمسحت'); return route(); }
  if (d.update) return downloadAll();
  if (d.voicehelp) return voiceHelp(d.voicehelp);
  if (d.copybk) { const t = $('#bk-out'); navigator.clipboard?.writeText(t.value).then(() => toast('✅ اتنسخت'), () => { t.select(); toast('النص متحدد — انسخه'); }) ?? (t.select(), toast('النص متحدد — انسخه')); return; }
  if (d.dlbk) {
    const blob = new Blob([$('#bk-out').value], { type: 'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `lisan-backup-${todayKey()}.json`;
    a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000); toast('⬇️ نزل ملف النسخة الاحتياطية'); return;
  }
  if (d.pickbkfile) { $('#bk-file')?.click(); return; }
  if (d.importbk) return restoreJSON($('#bk-in').value);
});

function syncProfile() {
  const f = $('#meForm'); if (!f) return;
  const fd = new FormData(f);
  profile = { name: fd.get('name').trim(), gender: fd.get('gender'), age: fd.get('age'), country: fd.get('country'), city: fd.get('city').trim(), job: fd.get('job'), hobbies: fd.getAll('hobbies').slice(0, 3) };
  store.set('profile', profile);
  const code = location.hash.split('-')[1];
  $('#introOut').innerHTML = introHTML(code, introLines(code));
}
document.addEventListener('input', e => {
  if (e.target.closest('#meForm')) return syncProfile();
  if (e.target.id === 'wordSearch') {
    wQuery = e.target.value;
    const pos = e.target.selectionStart;
    route();
    const inp = $('#wordSearch'); if (inp) { inp.focus(); inp.setSelectionRange(pos, pos); }
    return;
  }
  if (e.target.id === 'topicSearch') {
    topicQuery = e.target.value;
    const pos = e.target.selectionStart;
    route();
    const inp = $('#topicSearch'); if (inp) { inp.focus(); inp.setSelectionRange(pos, pos); }
  }
});
document.addEventListener('change', e => {
  if (e.target.id === 'bk-file' && e.target.files?.[0]) {
    e.target.files[0].text().then(txt => restoreJSON(txt));
    return;
  }
  if (e.target.name === 'hobbies' && document.querySelectorAll('#meForm input[name=hobbies]:checked').length > 3) { e.target.checked = false; toast('اختار ٣ بس'); }
  if (e.target.closest('#meForm')) syncProfile();
});
document.addEventListener('submit', e => {
  e.preventDefault();
  if (e.target.id === 'customWordForm') {
    const fd = new FormData(e.target);
    const lang = fd.get('lang'), t = (fd.get('t') || '').trim(), m = (fd.get('m') || '').trim(), note = (fd.get('note') || '').trim();
    if (!t || !m) return toast('اكتب الكلمة ومعناها الأول');
    addItem({ lang, t, m, note }, 1);
    showAddForm = false; route();
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') return closeSheet();
  if (e.target.matches('input, textarea, select') || $('#sheetWrap')) return;
  if (rv && rv.i < rv.queue.length) {
    if (e.code === 'Space') { e.preventDefault(); if (!rv.shown) { rv.shown = true; route(); } }
    else if (rv.shown && e.key === '1') grade('no');
    else if (rv.shown && e.key === '2') grade('yes');
  } else if (qz && qz.i < qz.qs.length) {
    if (qz.picked === null && ['1', '2', '3', '4'].includes(e.key)) {
      const idx = +e.key - 1; if (qz.qs[qz.i].opts[idx]) pick(idx);
    } else if (qz.picked !== null && (e.key === 'Enter' || e.code === 'Space')) {
      e.preventDefault();
      document.querySelector('[data-qnext]')?.click();
    }
  }
});

lastHash = location.hash;
route();
if (PWA) {
  if (store.get('justUpdated', false)) { store.set('justUpdated', false); toast('✅ اتحدّث وكل حاجة متحمّلة للاستخدام من غير نت'); }
  checkUpdate();
  window.addEventListener('online', checkUpdate);
  window.addEventListener('offline', () => { updState = 'offline'; paintUpd(); });
}
if ('speechSynthesis' in window) speechSynthesis.addEventListener?.('voiceschanged', () => { const h = location.hash; if (!h || h === '#home' || h.startsWith('#lang')) route(); });
</script>
